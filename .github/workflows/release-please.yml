on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs['extension--tag_name'] }}
      release_created: ${{ steps.release.outputs['extension--release_created'] }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          config-file: ".github/release-please-config.json"
          manifest-file: ".github/.release-please-manifest.json"

  submit:
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.release_created
    needs: release-please
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - run: pnpm install --frozen-lockfile

      - name: Build the extension
        run: |
          pnpm --filter extension run zip
          pnpm --filter extension run zip:firefox

      - name: Upload Release Artifact
        working-directory: ./extension
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: |
            Please refer to [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/extension/CHANGELOG.md) for details.
            ## Download
            - [Chrome](https://chromewebstore.google.com/detail/furigana-maker/heodojceeinbkfjfilnfminlkgbacpfp)
            - [Edge](https://microsoftedge.microsoft.com/addons/detail/furigana-maker/kohpoklaaeicnkdapjkmljdachedmbbi)
            - [Firefox](https://addons.mozilla.org/firefox/addon/furigana-maker/)
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} ./.output/*-chrome.zip
          gh release upload ${{ needs.release-please.outputs.tag_name }} ./.output/*-firefox.zip
          gh release edit ${{ needs.release-please.outputs.tag_name }} --notes "$RELEASE_NOTES"

      - name: Submit to stores
        working-directory: ./extension
        run: |
          pnpm --filter extension exec wxt submit \
            --chrome-zip ./.output/*-chrome.zip \
            --firefox-zip ./.output/*-firefox.zip \
            --edge-zip ./.output/*-chrome.zip \
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
